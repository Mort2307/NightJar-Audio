# Production Hosting, with a one-time explicit Nightjar Team backend-first release gate.
# All other merges retain the original Hosting-only behaviour.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual recovery path if a GitHub API-triggered merge does not emit a push workflow.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Dispatch the existing protected backend workflow for this one tagged release only.

concurrency:
  group: nightjar-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Use a GitHub Actions repository variable (preferred) or secret for this PUBLIC VAPID key.
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Protect production push notifications
        shell: bash
        run: |
          if [[ ! "$VITE_FIREBASE_VAPID_KEY" =~ ^[A-Za-z0-9_-]{80,110}$ ]]; then
            echo "::error::Nightjar Hosting deployment halted: VITE_FIREBASE_VAPID_KEY is missing or malformed. Set the PUBLIC Firebase Web Push key in GitHub Actions Variables."
            exit 1
          fi

      - name: Install and validate
        run: npm ci --no-fund && npm run validate

      # Owner-reviewed membership controls must reach Cloud Functions before
      # the new Safety UI is available on live Hosting. Failed backend deploy
      # blocks Hosting and does not issue a member suspension.
      - name: Deploy audited member security before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-member-safety-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const adminSetAccountSuspension = onCall' functions/src/index.ts
          grep -q 'export const memberAccessStatus = onCall' functions/src/index.ts
          node scripts/member-lockout-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminSetAccountSuspension,adminMemberSecurityDossier,adminRetryMemberSecurityNotice,memberAccessStatus,adminSetAccountRole,suspendFromSecurityAlert,accountIdentity,getLegalAgreementStatus,acceptLegalAgreements,stageRegistrationIntent,recordProtectionEvent,chooseAccountRole,createArtistPortfolioItem,createEditorPortfolioItem,submitReleaseForModeration,submitWriterScript,submitProfessionalApplication,adminManageProfessionalRoles,reviewProfessionalApplication' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Member-security backend deployment missing; Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Member lockout callable, session checks, role restrictions and alert suspension deployed."

      # Single explicitly consented live normal Didit check for one named
      # administrator. Deploy only the two new guarded functions, then Hosting.
      # Existing public pause, signed webhook and admin maintenance lock remain.
      - name: Deploy one-user live Didit check before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-meg-didit-single-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const startSingleMemberDiditMaintenanceCheck = onCall' functions/src/index.ts
          test -f scripts/didit-meg-single-check-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=singleMemberDiditMaintenanceStatus,startSingleMemberDiditMaintenanceCheck' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::One-user Didit backend deployment not found; Hosting stays unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "One-user KYC endpoint deployed; no verification session has been started."

      # Separate opt-in member recovery of EXISTING provider decisions only.
      # PRs and branch pushes never deploy production. Backend goes first.
      - name: Deploy member Didit decision recovery before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-member-recovery-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const reconcileMyDiditVerification = onCall' functions/src/index.ts
          node scripts/didit-reconciliation-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=reconcileMyDiditVerification' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Member Didit reconciliation was not deployed; keep Hosting unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Read-only member Didit decision recovery is deployed; no new ID session is created."

      # Only the owner-tagged merge may deploy this compatible cover backend.
      # PR previews and feature-branch pushes must NOT write production resources.
      - name: Deploy independently moderated member covers before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-profile-custom-cover-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/nightjar-custom-cover-profile-contracts.mjs
          node scripts/profile-hero-writer-navigation-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=submitImageAsset,moderateImageAsset,removeProfileBanner,saveMyProfile,getPublicProfile,getCreatorProfile,listPublicProfiles,listCreators' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Member cover backend was not deployed. Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Moderated member cover endpoints deployed before Hosting."

      # Approved profiles: account-derived moon, moderated portrait header,
      # and saved per-member styling. Deploy compatible callables before Hosting.
      - name: Deploy approved profile hero backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-profile-hero-writer-polish]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/profile-hero-writer-navigation-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=saveMyProfile,getPublicProfile,saveMyProfileWorkingDraft' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Profile preference backend not deployed. Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Server-approved badge and cover preferences released before the UI."

      # A mandatory 18+ release changes shared verification policy embedded in
      # every protected Cloud Function, not just ageStatus. Deploy ALL Functions
      # before Hosting, otherwise older endpoints can still honour tester bypasses.
      # Never automatically start a Didit session or create a billable provider check.
      - name: Enforce mandatory approved Didit access before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-mandatory-gate-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const TESTING_AGE_ASSURANCE_BYPASS = false' functions/src/index.ts
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          node scripts/didit-mandatory-gate-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Mandatory Didit backend release not found. Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "All protected functions now require a genuine account-linked Didit 18+ approval."

      # Staged account-wide release. No PR and no branch push deploys this.
      # Only a main push explicitly tagged for this change can dispatch the two
      # selected account-bound Didit callables before production Hosting updates.
      # All eligible signed-in members can opt in; legacy public starter stays paused.
      - name: Deploy all-account Didit self-service backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-all-members-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          grep -q 'const DIDIT_ACCOUNT_SELF_SERVICE_ENABLED = true' functions/src/index.ts
          test -f scripts/didit-direct-pilot-contracts.mjs
          node scripts/didit-direct-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=myDiditControlledCheck,startMyDiditControlledCheck' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Didit direct-pilot backend release missing. Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Account-wide Didit self-service is available. Legacy public starter stays paused."

      # Single account-bound member live check, globally paused otherwise.
      # Deploy these callables FIRST or the app's invitation will lead to a 404.
      - name: Deploy owner-authorised one-use Didit check before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-controlled-check-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const startMyDiditControlledCheck = onCall' functions/src/index.ts
          test -f scripts/didit-controlled-check-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminAuthoriseDiditControlledCheck,myDiditControlledCheck,startMyDiditControlledCheck' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Controlled Didit backend release not found; Hosting stays unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "One-time account-bound Didit functions deployed before Hosting. Public verification remains paused."

      # One explicitly authorised, potentially billable, account-bound member
      # check. The global public pause stays ON. Deploy the updated callable
      # and three pilot controllers BEFORE Hosting exposes the launch control.
      - name: Release one-use account-bound Didit member check before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-single-member-live-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          grep -q 'export const adminAuthoriseDiditMemberNormalPilot = onCall' functions/src/index.ts
          test -f scripts/didit-single-member-live-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminAuthoriseDiditMemberNormalPilot,adminDiditMemberNormalPilotStatus,myDiditMemberNormalPilot,startAgeAssurance' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Protected one-use Didit backend deployment was not found. Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "One-use member Didit test callable deployed; global public pause unchanged."

      # Production pause stays in place. Deploy only the three read-only
      # Didit reuse-readiness functions before exposing the control centre UI.
      - name: Deploy protected Didit reuse readiness before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-reuse-readiness-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const adminBindExistingDiditSource = onCall' functions/src/index.ts
          test -f scripts/didit-reuse-readiness-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminInspectDiditReuseWorkflow,adminBindExistingDiditSource,adminDiditReuseReadiness' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Didit reuse readiness backend run not found; Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Read-only provider readiness deployed. Member checks are still paused."

      # Account-owner consent and admin support triage for older standalone Didit
      # checks. This does NOT deploy provider session creation or age-pass writes.
      - name: Deploy Didit existing-check enquiries before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-reuse-enquiries-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f scripts/didit-reuse-enquiry-contracts.mjs
          grep -q "export const requestDiditReuse = onCall" functions/src/index.ts
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=myDiditReuseRequest,requestDiditReuse,withdrawDiditReuseRequest,adminListDiditReuseRequests,adminReviewDiditReuseRequest' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Didit reuse backend release not found; Hosting stays unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Protected consented Didit reuse support backend deployed before Hosting."

      # Explicitly authorized one-time recovery of a previously approved Didit
      # admin session. Deploy only the protected provider GET reconciliation
      # callable before making its control available on Hosting.
      - name: Release owner-only Didit approval recovery before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-reconciliation-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const adminReconcileDiditApproval = onCall' functions/src/index.ts
          test -f scripts/didit-reconciliation-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminReconcileDiditApproval,adminDiditDiagnostics' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit approval recovery backend run not found; Hosting remains unchanged."
            exit 1
          fi
          echo "Protected backend release: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Owner-only Didit reconciliation deployed before Hosting."

      # Explicit one-time backend-first release for the owner-only Didit
      # diagnostics. No public verification endpoints or existing Didit secrets
      # are modified. Hosting must not go live without the protected callable.
      - name: Release read-only Didit diagnostics before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-diagnostics-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
