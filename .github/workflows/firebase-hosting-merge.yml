# Production Hosting, with a one-time explicit Nightjar Team backend-first release gate.
# All other merges retain the original Hosting-only behaviour.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual recovery path if a GitHub API-triggered merge does not emit a push workflow.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Dispatch the existing protected backend workflow for this one tagged release only.

concurrency:
  group: nightjar-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Use a GitHub Actions repository variable (preferred) or secret for this PUBLIC VAPID key.
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Protect production push notifications
        shell: bash
        run: |
          if [[ ! "$VITE_FIREBASE_VAPID_KEY" =~ ^[A-Za-z0-9_-]{80,110}$ ]]; then
            echo "::error::Nightjar Hosting deployment halted: VITE_FIREBASE_VAPID_KEY is missing or malformed. Set the PUBLIC Firebase Web Push key in GitHub Actions Variables."
            exit 1
          fi

      - name: Install and validate
        run: npm ci --no-fund && npm run validate

      # The one-time PR #102 release marker is supplied only by the deliberate
      # squash merge commit. Ordinary pushes and manual Hosting recovery do NOT
      # deploy backend resources. We never deploy the frontend if this step fails.
      - name: Release Nightjar Team backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-team-102-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Coordinating the Nightjar Team release for ${GITHUB_SHA}."
          test -f src/components/NightjarTeamCommunity.tsx
          test -f src/platform/firebase-team-community.ts
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=saveMyProfile,listPublicProfiles,getPublicProfile,setProfileFollow,listNightjarTeamUpdates,saveNightjarTeamUpdate,submitNightjarTeamFeedback,reviewNightjarTeamFeedback' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Backend release requested; awaiting confirmed workflow success."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "$GITHUB_SHA" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Could not identify this release's backend workflow. Hosting remains unchanged."
            exit 1
          fi
          echo "Backend run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          echo "Protected backend deployment succeeded. Hosting may now release."

      - name: Deploy Hosting live
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIGHTJAR_AUDIO }}
          channelId: live
          projectId: nightjar-audio

      - name: Verify deployed version matches commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "https://nightjar-audio.web.app/version.json?verify=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.sourceCommit == $sha' >/dev/null; then
              echo "Nightjar Hosting smoke test passed for $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live Hosting version.json did not match the deployed commit. Verify Hosting immediately."
          exit 1

      - name: Summarise release
        if: always()
        run: |
          echo "### Nightjar Firebase Hosting production" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting: https://nightjar-audio.web.app" >> "$GITHUB_STEP_SUMMARY"
