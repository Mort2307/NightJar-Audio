# Production Hosting, with a one-time explicit Nightjar Team backend-first release gate.
# All other merges retain the original Hosting-only behaviour.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual recovery path if a GitHub API-triggered merge does not emit a push workflow.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Dispatch the existing protected backend workflow for this one tagged release only.

concurrency:
  group: nightjar-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Use a GitHub Actions repository variable (preferred) or secret for this PUBLIC VAPID key.
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Protect production push notifications
        shell: bash
        run: |
          if [[ ! "$VITE_FIREBASE_VAPID_KEY" =~ ^[A-Za-z0-9_-]{80,110}$ ]]; then
            echo "::error::Nightjar Hosting deployment halted: VITE_FIREBASE_VAPID_KEY is missing or malformed. Set the PUBLIC Firebase Web Push key in GitHub Actions Variables."
            exit 1
          fi

      - name: Install and validate
        run: npm ci --no-fund && npm run validate

      # Explicit one-time backend-first release for the owner-only Didit
      # diagnostics. No public verification endpoints or existing Didit secrets
      # are modified. Hosting must not go live without the protected callable.
      - name: Release read-only Didit diagnostics before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-diagnostics-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q "export const adminDiditDiagnostics = onCall" functions/src/index.ts
          test -f src/components/AdminDiditControlCentre.tsx
          test -f scripts/admin-didit-control-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminDiditDiagnostics' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Waiting for the protected admin-only Didit diagnostics function deployment."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit diagnostics backend run not found; Hosting remains unchanged."
            exit 1
          fi
          echo "Protected backend deployment: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Read-only diagnostics deployed. Hosting may now display the new Didit tile."

      # The one-time PR #102 release marker is supplied only by the deliberate
      # squash merge commit. Ordinary pushes and manual Hosting recovery do NOT
      # deploy backend resources. We never deploy the frontend if this step fails.
      - name: Release Nightjar Team backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-team-102-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Coordinating the Nightjar Team release for ${GITHUB_SHA}."
          test -f src/components/NightjarTeamCommunity.tsx
          test -f src/platform/firebase-team-community.ts
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=saveMyProfile,listPublicProfiles,getPublicProfile,setProfileFollow,listNightjarTeamUpdates,saveNightjarTeamUpdate,submitNightjarTeamFeedback,reviewNightjarTeamFeedback' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Backend release requested; awaiting confirmed workflow success."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "$GITHUB_SHA" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Could not identify this release's backend workflow. Hosting remains unchanged."
            exit 1
          fi
          echo "Backend run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          echo "Protected backend deployment succeeded. Hosting may now release."

      # One-time backend-first announcement release, never a message send.
      - name: Release community update callables before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-community-update-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f src/components/AdminCommunityUpdates.tsx
          test -f src/components/CommunityUpdateReader.tsx
          test -f src/platform/firebase-community-updates.ts
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminPublishCommunityUpdate,getCommunityUpdate,adminListCommunityUpdates' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Waiting for the guarded backend release before Hosting."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "$GITHUB_SHA" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Community backend release not confirmed; Hosting remains unchanged."
            exit 1
          fi
          echo "Backend run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          echo "Community update backend deployed. Hosting can now release."

      # Explicit one-time approval mail backend deployment. New approval events only:
      # this does NOT send mail retroactively or change the Nightjar Gmail account.
      - name: Release approval mail functions before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-approval-mail-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f functions/src/index.ts
          test -f scripts/professional-application-bank-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=sendProfessionalApprovalEmail,adminRetryProfessionalApprovalEmail' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Approval mail backend dispatch requested, awaiting protected deployment."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Approval mail backend run could not be confirmed; Hosting remains unchanged."
            exit 1
          fi
          echo "Approval mail backend run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Approval mail backend deployed; Hosting can now release."

      # One-time feature release: deploy selected authenticated on-demand
      # callables before making their consumer controls available in Hosting.
      - name: Release NightJar listening experience backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-listening-experience-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f src/components/ListeningDiscoveryControls.tsx
          test -f src/components/CreatorProductionTimeline.tsx
          test -f src/components/VoiceCallingCard.tsx
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=getMyListeningBoundaries,saveMyListeningBoundaries,listMomentMarks,saveMomentMark,deleteMomentMark,saveVoiceCallingCard,getVoiceCallingCard,myProductionTimeline' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Experience backend release not confirmed; Hosting remains unchanged."
            exit 1
          fi
          echo "Experience backend workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Selected experience backend deployed. Hosting may release."

      # Replace the retired appdeploy.ai cron (HTTP 403) with NightJar's
      # existing UK-time, idempotent Firebase scheduled function.
      # This runs only for the explicitly tagged squash merge below.
      - name: Release native Spotlight schedule before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-native-spotlight-schedule-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -f .github/workflows/spotlight-scheduler.yml
          grep -q "export const notifyDailySpotlights = onSchedule" functions/src/index.ts
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=notifyDailySpotlights' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Native 09:00 UK-time Spotlight schedule requested; awaiting protected backend deploy."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Native Spotlight scheduler backend deployment was not confirmed; Hosting remains unchanged."
            exit 1
          fi
          echo "Spotlight scheduler backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Native Spotlight schedule deployed. Hosting may release."

      # One-time member-finance embargo: protect callable responses in production
      # BEFORE publishing the UI that removes paid/member-facing finance screens.
      - name: Restrict beta finance callables before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-finance-embargo-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f scripts/member-finance-embargo-contracts.mjs
          node scripts/member-finance-embargo-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=transparencySnapshot,myListeningAccess,listScriptMarketplace,nightjarGiftConfig,myNightjarWallet,sendNightjars,myNightjarEarnings,myNightjarGiftHistory' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          echo "Deploying the 3 beta confidentiality callables before Hosting."
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Finance embargo backend deployment not confirmed; Hosting remains unchanged."
            exit 1
          fi
          echo "Beta finance backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Member-facing financial details are now restricted by Firebase functions."

      # Writer-owned marketplace asking prices are public listing information,
      # NOT platform pay caps or subscription pool arrangements.
      # Update its callable before releasing the UI which displays those prices.
      - name: Deploy writer-owned script pricing callable
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-writer-pricing-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/member-finance-embargo-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=listScriptMarketplace' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Writer marketplace pricing callable deployment not confirmed; Hosting unchanged."
            exit 1
          fi
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Writer asking-price API is live; internal financial projections remain admin-only."

      # One-time release of the current versioned Didit agreement endpoints.
      # Never start an age-verification session, change the existing beta bypass,
      # or deploy the compulsory age gate in PR #154 as part of this release.
      - name: Release Didit age-notice agreement endpoints before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-age-legal-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f src/legal/nightjarLegal.ts
          test -f src/platform/firebase-legal.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=getLegalAgreementStatus,acceptLegalAgreements' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Could not confirm scoped Didit legal backend release. Hosting remains unchanged."
            exit 1
          fi
          echo "Age-notice agreement functions deployment: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Didit notice acknowledgement API deployed. Mandatory age gate remains separate."

      # Pause start/status BEFORE the public UI. Never alter prior verified-age records.
      - name: Pause Didit start endpoint before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-pause-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=startAgeAssurance,ageStatus' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit backend pause unconfirmed; Hosting stays unchanged."
            exit 1
          fi
          echo "Didit pause backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "New Didit session creation is disabled."

      # One-time controlled Didit administrator test. Keep the PUBLIC shutdown
      # enabled and deploy its server-side one-shot guard BEFORE the private UI.
      - name: Release one-shot Didit administrator test backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-admin-one-shot-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          grep -q 'DIDIT_VERIFICATION_PAUSED && identity.admin && requestedControlledAdminTest' functions/src/index.ts
          grep -q 'transaction.create(testGuard' functions/src/index.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=startAgeAssurance,ageStatus' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit maintenance backend not confirmed; private test UI stays unreleased."
            exit 1
          fi
          echo "Didit admin one-shot backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Protected administrator test backend deployed. Public verification remains paused."

      - name: Deploy Hosting live
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIGHTJAR_AUDIO }}
          channelId: live
          projectId: nightjar-audio

      - name: Verify deployed version matches commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "https://nightjar-audio.web.app/version.json?verify=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.sourceCommit == $sha' >/dev/null; then
              echo "Nightjar Hosting smoke test passed for $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live Hosting version.json did not match the deployed commit. Verify Hosting immediately."
          exit 1

      - name: Summarise release
        if: always()
        run: |
          echo "### Nightjar Firebase Hosting production" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting: https://nightjar-audio.web.app" >> "$GITHUB_STEP_SUMMARY"
