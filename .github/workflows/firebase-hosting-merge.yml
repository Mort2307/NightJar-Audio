            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Writer marketplace pricing callable deployment not confirmed; Hosting unchanged."
            exit 1
          fi
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Writer asking-price API is live; internal financial projections remain admin-only."

      # One-time release of the current versioned Didit agreement endpoints.
      # Never start an age-verification session, change the existing beta bypass,
      # or deploy the compulsory age gate in PR #154 as part of this release.
      - name: Release Didit age-notice agreement endpoints before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-age-legal-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f src/legal/nightjarLegal.ts
          test -f src/platform/firebase-legal.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=getLegalAgreementStatus,acceptLegalAgreements' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Could not confirm scoped Didit legal backend release. Hosting remains unchanged."
            exit 1
          fi
          echo "Age-notice agreement functions deployment: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Didit notice acknowledgement API deployed. Mandatory age gate remains separate."

      # Pause start/status BEFORE the public UI. Never alter prior verified-age records.
      - name: Pause Didit start endpoint before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-pause-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=startAgeAssurance,ageStatus' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit backend pause unconfirmed; Hosting stays unchanged."
            exit 1
          fi
          echo "Didit pause backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "New Didit session creation is disabled."

      # One-time controlled Didit administrator test. Keep the PUBLIC shutdown
      # enabled and deploy its server-side one-shot guard BEFORE the private UI.
      - name: Release one-shot Didit administrator test backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-didit-admin-one-shot-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const DIDIT_VERIFICATION_PAUSED = true' functions/src/index.ts
          grep -q 'DIDIT_VERIFICATION_PAUSED && identity.admin && requestedControlledAdminTest' functions/src/index.ts
          grep -q 'transaction.create(testGuard' functions/src/index.ts
          node scripts/didit-pilot-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=startAgeAssurance,ageStatus' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Didit maintenance backend not confirmed; private test UI stays unreleased."
            exit 1
          fi
          echo "Didit admin one-shot backend: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BACKEND_RUN_ID}"
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Protected administrator test backend deployed. Public verification remains paused."

      # Velvet Interaction release: two strictly scoped backend batches in order.
      # Firestore index first; ONE read-only social lookup function second; then
      # and only then publish its UI. No Didit, billing, or other functions.
      - name: Release public connections backend in small batches
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-public-connections-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const listPublicProfileConnections = onCall' functions/src/index.ts
          node scripts/profile-connections-contracts.mjs
          node -e "const x=require('./firestore.indexes.json');if(!x.fieldOverrides.some(v=>v.collectionGroup==='follows' && v.fieldPath==='targetUserId' && v.indexes?.some(i=>i.queryScope==='COLLECTION_GROUP')))process.exit(1)"

          # Deliberately 1 scope per release, never `functions` or `all-backend`.
          deploy_single_batch() {
            local scope="$1" functions="${2:-}" start run_id
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Nightjar small batch: ${scope}${functions:+ ($functions)}"
            if [[ "$scope" == "functions:selected" ]]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
                -f ref=main -f "inputs[scope]=$scope" \
                -f "inputs[function_names]=$functions" \
                -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
                -f ref=main -f "inputs[scope]=$scope" \
                -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
            fi
            run_id=""
            for attempt in $(seq 1 48); do
              run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
                | jq -r --arg head "${GITHUB_SHA}" --arg start "$start" \
                  '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
              if [[ -n "$run_id" ]]; then break; fi
              sleep 10
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::Could not find confirmed backend batch for $scope; Hosting remains unchanged."
              exit 1
            fi
            echo "Nightjar $scope: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$run_id"
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          }
          deploy_single_batch 'firestore:indexes'
          deploy_single_batch 'functions:selected' 'listPublicProfileConnections'
          echo "Public connections index and the single callable are deployed; safe to publish UI."

      # Review-safe timed captions require the protected callable endpoints
      # to be live before frontend controls become visible. No AI services.
      - name: Deploy reviewed manual transcript sync before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-manual-transcript-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const getReleaseSyncAudioUrl = onCall' functions/src/index.ts
          grep -q 'export const saveSyncedReleaseTranscript = onCall' functions/src/index.ts
          node scripts/transcript-sync-contracts.mjs
          deploy_batch() {
            local names="$1" start id
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
              -f ref=main -f 'inputs[scope]=functions:selected' \
              -f "inputs[function_names]=$names" -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
            id=""
            for attempt in $(seq 1 48); do
              id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
                | jq -r --arg head "${GITHUB_SHA}" --arg start "$start" \
                  '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
              if [[ -n "$id" ]]; then break; fi
              sleep 10
            done
            if [[ -z "$id" ]]; then
              echo "::error::Transcript backend batch $names not found; Hosting blocked."
              exit 1
            fi
            gh run watch "$id" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          }
          deploy_batch 'getReleaseSyncAudioUrl,saveSyncedReleaseTranscript'
          deploy_batch 'finalizeReleaseAudio'
          echo "Age-gated manual transcript backend is live before Hosting."

      - name: Deploy Hosting live
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIGHTJAR_AUDIO }}
          channelId: live
          projectId: nightjar-audio

      - name: Verify deployed version matches commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "https://nightjar-audio.web.app/version.json?verify=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.sourceCommit == $sha' >/dev/null; then
              echo "Nightjar Hosting smoke test passed for $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live Hosting version.json did not match the deployed commit. Verify Hosting immediately."
          exit 1

      - name: Summarise release
        if: always()
        run: |
          echo "### Nightjar Firebase Hosting production" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting: https://nightjar-audio.web.app" >> "$GITHUB_STEP_SUMMARY"
