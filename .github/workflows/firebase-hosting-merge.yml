# Production Hosting, with a one-time explicit Nightjar Team backend-first release gate.
# All other merges retain the original Hosting-only behaviour.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual recovery path if a GitHub API-triggered merge does not emit a push workflow.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Dispatch the existing protected backend workflow for this one tagged release only.

concurrency:
  group: nightjar-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Use a GitHub Actions repository variable (preferred) or secret for this PUBLIC VAPID key.
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Protect production push notifications
        shell: bash
        run: |
          if [[ ! "$VITE_FIREBASE_VAPID_KEY" =~ ^[A-Za-z0-9_-]{80,110}$ ]]; then
            echo "::error::Nightjar Hosting deployment halted: VITE_FIREBASE_VAPID_KEY is missing or malformed. Set the PUBLIC Firebase Web Push key in GitHub Actions Variables."
            exit 1
          fi

      - name: Install and validate
        run: npm ci --no-fund && npm run validate

      # Expose the Admin-only read-only storage audit only after its backend
      # has been deployed. No storage deletion or periodic cleanup is included.
      - name: Deploy private audio audit before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-private-audio-audit-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/private-audio-orphan-audit-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminAuditReleaseAudioStorage' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Private audio audit backend deployment missing; Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Read-only Admin private audio audit verified before Hosting."

      # A thank-you may be sent only after the corresponding Admin approval.
      # Deploy the exact changed moderation callables before shipping the change.
      - name: Deploy personal contributor thank-yous before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-work-thanks-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/approved-work-thank-you-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=moderateRelease,moderateEditorPortfolioItem,adminReviewWriterScript,moderateImageAsset' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          BACKEND_RUN_ID=""
          for attempt in $(seq 1 48); do
            BACKEND_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$BACKEND_RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$BACKEND_RUN_ID" ]]; then
            echo "::error::Approval thank-you backend dispatch missing. Hosting blocked."
            exit 1
          fi
          gh run watch "$BACKEND_RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Contributor thank-you backend verified before Hosting."

      # Protect private Creator and Editor audio by retiring canonical state
      # before Storage deletion. All interdependent callables ship together.
      - name: Deploy safe media removal before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-safe-media-removal-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/private-media-removal-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" -f ref=main -f 'inputs[scope]=functions:selected' -f 'inputs[function_names]=removeReleaseAudio,finalizeReleaseAudio,creatorDashboard,removeEditorPortfolioItem,finalizeEditorPortfolioAudio,getEditorPortfolioAudioUrl' -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then echo "::error::Safe media removal backend dispatch was not found. Hosting blocked."; exit 1; fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Creator and Editor safe media removal functions deployed before Hosting."

      # Full Creator/Admin release deletion retires status atomically before
      # deleting private Storage files. Never expose new UI first.
      - name: Deploy whole-release safe deletion before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-safe-whole-release-removal]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/full-release-removal-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" -f ref=main -f 'inputs[scope]=functions:selected' -f 'inputs[function_names]=deleteRelease,adminRemoveRelease' -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then echo "::error::Full-release removal backend dispatch was not found. Hosting blocked."; exit 1; fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15

      # Never deploy artwork-cleanup UI before linked image/parent retirement
      # is enforced by the selected protected Cloud Function.
      - name: Deploy transaction-first image removal before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-safe-image-removal-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/private-image-removal-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" -f ref=main -f 'inputs[scope]=functions:selected' -f 'inputs[function_names]=removeOwnedImageAsset' -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then echo "::error::Image removal backend was not dispatched. Hosting blocked."; exit 1; fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15

      # Deploy paged Admin release queries before exposing cursor-enabled UI.
      - name: Deploy bounded Admin queues before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-admin-bounded-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/admin-server-pagination-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=adminReleaseAudioLibrary,releaseModerationQueue' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Bounded Admin backend deployment missing; Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Bounded Admin read endpoints deployed before Hosting."

      # Keep the moderation decision and its reason atomic before any
      # updated Administration UI/release reaches Hosting.
      # Only immutable review and scheduled-publication events opt in to
      # create-once dedupe; repeated account and Listener events remain live.
      - name: Deploy moderation notification dedupe before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-notification-dedupe-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/notification-create-dedupe-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=moderateRelease,moderateEditorPortfolioItem,adminReviewWriterScript,moderateImageAsset,submitReleaseForModeration,publishScheduledReleases' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Moderation notification dedupe backend deployment missing. Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Critical moderation notification dedupe deployed before Hosting."

      - name: Deploy atomic private audio finalize before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-atomic-audio-finalize-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/media-finalize-concurrency-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=finalizeReleaseAudio,finalizeEditorPortfolioAudio' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Audio finalization backend deployment not found; Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Atomic audio finalizers deployed before Hosting."

      - name: Deploy atomic Editor moderation before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-editor-review-atomic-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/editor-moderation-atomic-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=submitEditorPortfolioItem,moderateEditorPortfolioItem' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Editor moderation backend deployment missing. Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Atomic Editor moderation backend verified before Hosting."

      # A lost create response may follow a successful Firestore commit.
      # Ship owner-verified idempotent creates before the new client receipts.
      - name: Deploy private create idempotency before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-idempotent-create-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/private-create-idempotency-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=createRelease,createArtistPortfolioItem,createEditorPortfolioItem' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Private create backend deployment missing; Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Idempotent private record endpoints deployed before Hosting."

      # Deploy transactional metadata compare-and-swap before enabling
      # Creator autosave. A failed backend verification blocks Hosting.
      - name: Deploy Creator metadata CAS before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-creator-autosave-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/creator-release-autosave-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=updateRelease,createRelease,creatorDashboard' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Creator metadata backend deployment not found. Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Transactional Creator metadata endpoints deployed before Hosting."

      # An account form draft must never be exposed by Hosting before the
      # exact role-gated and revision-checked callables are live.
      # Tagged once on the merge commit; no added queue or paid infrastructure.
      - name: Deploy Studio form draft backend before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-studio-form-drafts-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/studio-form-draft-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=getMyProfileWorkingDraft,saveMyProfileWorkingDraft,clearMyProfileWorkingDraft' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "${START_TIME}" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Studio drafts backend deployment not found; Hosting blocked."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Role-gated Studio draft CAS callables deployed and verified before Hosting."

      # First account-synced saved views release, together with the earlier
      # Moment Marks quota transaction fix. Backend is required before new UI.
      # Tagged one-time opt-in, not a recurring/new infrastructure service.
      - name: Deploy account saved views and Moment Marks before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-account-sync-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'export const getMyDirectoryViews = onCall' functions/src/index.ts
          grep -q 'export const saveMyDirectoryViews = onCall' functions/src/index.ts
          grep -q 'export const saveMomentMark = onCall' functions/src/index.ts
          grep -q 'export const deleteMomentMark = onCall' functions/src/index.ts
          node scripts/listening-experience-contracts.mjs
          node scripts/directory-view-sync-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=getMyDirectoryViews,saveMyDirectoryViews,saveMomentMark,deleteMomentMark' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Account-sync backend deployment missing; Hosting remains unchanged."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "Account views and Moment Marks cloud functions deployed before Hosting."

      # An ambiguous audio finalize response must not cause the browser to
      # delete already-attached private media. Deploy the idempotent backend
      # first, in one selected-function batch, before updating Hosting.
      - name: Deploy safe audio finalization before Hosting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[nightjar-safe-audio-finalize-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'const alreadyAttached = current.audioStoragePath === storagePath' functions/src/index.ts
          node scripts/audio-upload-contracts.mjs
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/dispatches" \
            -f ref=main -f 'inputs[scope]=functions:selected' \
            -f 'inputs[function_names]=finalizeReleaseAudio' \
            -f 'inputs[confirmation]=DEPLOY-NIGHTJAR'
          RUN_ID=""
          for attempt in $(seq 1 48); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-backend-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30" \
              | jq -r --arg head "${GITHUB_SHA}" --arg start "$START_TIME" \
                '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
