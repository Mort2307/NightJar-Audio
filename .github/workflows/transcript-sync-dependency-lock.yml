# TEMPORARY: only on the transcript feature branch; remove after lock update.
name: Prepare transcript runtime dependency lock
on:
  push:
    branches: [feature/zero-api-transcript-sync]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact @huggingface/transformers@3.8.1 --package-lock-only --ignore-scripts --no-fund --no-audit
      - run: |
          git config user.name "NightJar GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock bundled local speech recognition dependency"
            git push origin HEAD:feature/zero-api-transcript-sync
          fi
