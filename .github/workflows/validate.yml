name: Nightjar validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nightjar-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate app
        run: npm run validate

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck Firebase Functions
        working-directory: functions
        run: npm run check

      - name: Audit Firebase Functions production dependencies
        working-directory: functions
        run: npm run audit:guard
