name: Nightjar validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/self-service-professional-roles-20261010]

permissions:
  contents: read

concurrency:
  group: nightjar-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Syntax-check Firebase IAM bootstrap
        run: bash -n scripts/setup-firebase-backend-iam.sh

      - name: Install app dependencies
        run: npm ci

      - name: Validate app
        run: npm run validate

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck Firebase Functions
        working-directory: functions
        run: npm run check

      - name: Test Profile Types, Commitments, Creator Pool and Finance calculations
        working-directory: functions
        run: npm run test:systems

      - name: Determine backend change scope
        id: scope
        run: node scripts/ci-release-scope.mjs

      - name: Test fail-closed release scope
        run: node --test scripts/ci-release-scope.test.mjs

      # Unchanged backend advisories are monitored by the dedicated nightly
      # security workflow, without blocking an otherwise validated Hosting fix.
      # Any backend source/lockfile/rules/config change still requires audit.
      - name: Audit Firebase Functions production dependencies
        if: steps.scope.outputs.backend_changed == 'true'
        working-directory: functions
        run: npm run audit:guard

      - name: Test Firebase release planner and verification safeguards
        run: node --test scripts/firebase-backend-tools.test.mjs
