name: NightJar secret history scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Weekly full-history review, Monday 03:17 UTC.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nightjar-secret-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Redacted secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          # Never publish raw findings in comments or downloadable artifacts.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan full Git history across all fetched refs
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nightjar-gitleaks-full-history.sarif"
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code=2 \
            --log-opts=--all \
            --report-format=sarif \
            --report-path="$report" \
            --log-level=error
          echo "Full Git history scan passed across all fetched refs." >> "$GITHUB_STEP_SUMMARY"
