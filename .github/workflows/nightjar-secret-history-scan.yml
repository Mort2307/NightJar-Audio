name: NightJar secret history scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Weekly full-history review, Monday 03:17 UTC.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nightjar-secret-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Redacted secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits with Gitleaks
        id: diff-scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          # Never publish raw findings in comments, summaries or artifacts.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan full Git history across all fetched refs
        id: full-history
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nightjar-gitleaks-full-history.sarif"
          set +e
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code=2 \
            --log-opts=--all \
            --report-format=sarif \
            --report-path="$report" \
            --log-level=error
          scan_status=$?
          set -e

          # Print location-only metadata. Never print SARIF messages, matched
          # text, snippets, secret values or upload the report as an artifact.
          if [[ -s "$report" ]]; then
            node - "$report" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const results = report.runs?.flatMap(run => run.results ?? []) ?? [];
          console.log(`Gitleaks findings: ${results.length}`);
          for (const item of results) {
            const location = item.locations?.[0]?.physicalLocation ?? {};
            const file = location.artifactLocation?.uri ?? 'unknown file';
            const line = location.region?.startLine ?? 'unknown line';
            const commit = item.partialFingerprints?.commitSha ?? 'unknown commit';
            console.log(`rule=${item.ruleId ?? 'unknown'} commit=${String(commit).slice(0,12)} file=${file} line=${line}`);
          }
          NODE
          fi

          if [[ "$scan_status" -ne 0 ]]; then
            echo "::error::Full Git history scan detected a finding or encountered an error. Review only the location metadata above; rotate credentials before considering any ignore."
            exit "$scan_status"
          fi
          echo "Full Git history scan passed across all fetched refs." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce both redacted scans
        if: ${{ always() }}
        shell: bash
        env:
          DIFF_SCAN_OUTCOME: ${{ steps.diff-scan.outcome }}
          FULL_HISTORY_OUTCOME: ${{ steps.full-history.outcome }}
        run: |
          set -euo pipefail
          [[ "$DIFF_SCAN_OUTCOME" == "success" ]] || {
            echo "::error::The changed-commit secret scan failed. Review redacted Gitleaks findings and rotate any exposed credential."
            exit 1
          }
          [[ "$FULL_HISTORY_OUTCOME" == "success" ]] || {
            echo "::error::The full Git history secret scan failed. Review redacted findings and rotate any exposed credential."
            exit 1
          }
