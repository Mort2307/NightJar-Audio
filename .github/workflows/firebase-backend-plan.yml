# Read-only candidate analysis on backend-related PRs. Never deploy from PRs.
name: Nightjar backend release candidates

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'scripts/firebase-backend-*.mjs'
      - '.github/workflows/firebase-backend-*.yml'

permissions:
  contents: read

concurrency:
  group: nightjar-backend-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advise:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR and full diff history (no credentials retained)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache-dependency-path: functions/package-lock.json
          cache: npm
      - name: Install TypeScript for safe AST analysis
        run: npm --prefix functions ci --ignore-scripts --no-fund --no-audit
      - name: Generate advisory change plan, no Firebase credentials
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/firebase-backend-plan.mjs --base "$PR_BASE_SHA" \\
            --output "$RUNNER_TEMP/nightjar-backend-plan.json" \\
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Test planner and report contracts
        run: node --test scripts/firebase-backend-tools.test.mjs
      - name: Upload suggested batches JSON (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-backend-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/nightjar-backend-plan.json
          if-no-files-found: error
          retention-days: 14
