name: Enable Nightjar audio equalizer CORS (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENABLE-NIGHTJAR-AUDIO-EQ to allow the storage CORS update
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightjar-audio-eq-cors
  cancel-in-progress: false

jobs:
  audio_cors:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-backend
    steps:
      - name: Check exact release intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "ENABLE-NIGHTJAR-AUDIO-EQ" ]] || {
            echo "::error::Explicit EQ CORS configuration approval is required."; exit 1;
          }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Authenticate to existing Nightjar deploy account
        uses: google-github-actions/auth@v3
        with:
          project_id: nightjar-audio
          workload_identity_provider: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nightjar-audio
      - name: Prepare append-only bucket policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gcloud config get-value project)" == "nightjar-audio" ]] || exit 1
          gcloud storage buckets describe gs://nightjar-audio.firebasestorage.app --format=json > "$RUNNER_TEMP/nightjar-audio-bucket.json"
          node scripts/prepare-nightjar-audio-cors.mjs "$RUNNER_TEMP/nightjar-audio-bucket.json" "$RUNNER_TEMP/nightjar-audio-cors.json"
      - name: Apply and verify scoped CORS update
        shell: bash
        run: |
          set -euo pipefail
          # This modifies CORS response headers only. It does not change
          # Storage rules, public access permissions or signed-URL expiry.
          gcloud storage buckets update gs://nightjar-audio.firebasestorage.app --cors-file="$RUNNER_TEMP/nightjar-audio-cors.json"
          gcloud storage buckets describe gs://nightjar-audio.firebasestorage.app --format=json > "$RUNNER_TEMP/nightjar-audio-verified.json"
          node --input-type=module - "$RUNNER_TEMP/nightjar-audio-verified.json" <<'NODE'
          import fs from 'node:fs';
          const bucket=JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const origins=['https://nightjar-audio.web.app','https://nightjar-audio.firebaseapp.com'];
          const good=(bucket.cors??[]).some(r=>origins.every(o=>r.origin?.includes(o))&&r.method?.includes('GET'));
          if (!good) throw new Error('Nightjar audio EQ CORS rule missing after write.');
          console.log('Verified: Nightjar audio storage now allows browser GET CORS from official Hosting origins.');
          NODE
          echo "### Nightjar audio EQ storage" >> "$GITHUB_STEP_SUMMARY"
          echo "CORS configuration verified for official Nightjar Hosting origins." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing CORS entries retained. Private Storage access rules unchanged." >> "$GITHUB_STEP_SUMMARY"
