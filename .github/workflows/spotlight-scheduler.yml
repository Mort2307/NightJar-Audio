name: Nightjar spotlight scheduler

on:
  schedule:
    # Run just after midnight in both GMT and BST; the backend uses Europe/London
    # as the source of truth and notification creation is idempotent.
    - cron: '5 23 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  materialize-spotlights:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize today's spotlight notifications
        env:
          NIGHTJAR_BACKEND_URL: https://nightjar-42eeag.v2.appdeploy.ai
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nightjar")"
          oidc_token="$(jq -r '.value // empty' <<< "${token_response}")"
          test -n "${oidc_token}"
          response="$(curl -fsSL             -X POST             -H "Content-Type: application/json"             --data "$(jq -nc --arg token "${oidc_token}" '{token:$token}')"             "${NIGHTJAR_BACKEND_URL}/api/internal/cron/spotlights")"
          jq -e '.ok == true' <<< "${response}" >/dev/null
          echo "Nightjar spotlight notifications materialized: $(jq -r '.created // 0' <<< "${response}") created / $(jq -r '.attempted // 0' <<< "${response}") attempted."
