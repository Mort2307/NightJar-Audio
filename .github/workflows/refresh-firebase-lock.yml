name: Refresh Firebase dependency lock
on:
  push:
    branches:
      - feature/nightjar-gifts-artists
    paths:
      - .github/workflows/refresh-firebase-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nightjar-gifts-artists
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Firebase web SDK and patched gRPC transport
        run: |
          npm pkg set 'overrides.@grpc/grpc-js=1.14.5'
          npm install firebase@12.19.0 --save --package-lock-only --ignore-scripts

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Firebase web SDK and patched gRPC transport"
          git push origin HEAD:feature/nightjar-gifts-artists
