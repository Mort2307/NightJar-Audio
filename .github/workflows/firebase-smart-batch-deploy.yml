name: NightJar Smart Batch Firebase Backend (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-NIGHTJAR to authorize production writes
        required: true
        type: string
      function_names:
        description: Comma-separated exported functions (explicit release manifest)
        required: true
        type: string
      batch_size:
        description: Maximum functions per batch (1-5)
        required: true
        default: '5'
        type: choice
        options: ['1', '2', '3', '4', '5']
permissions:
  contents: read
  id-token: write
concurrency:
  group: nightjar-firebase-backend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Check release authorization and inputs
        env:
          CONFIRM: ${{ inputs.confirmation }}
          NAMES: ${{ inputs.function_names }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == 'DEPLOY-NIGHTJAR' ]] || { echo '::error::Explicit production confirmation required'; exit 1; }
          [[ -n "$NAMES" ]] || { echo '::error::Function manifest is empty'; exit 1; }
          [[ "${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}" == 'nightjar-backend-deploy@nightjar-audio.iam.gserviceaccount.com' ]] || exit 1
      - run: npm install --global firebase-tools@15.33.0 --no-fund --no-audit
      - uses: google-github-actions/auth@v3
        with:
          project_id: nightjar-audio
          workload_identity_provider: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - run: npm ci --no-fund && npm run validate
      - run: npm --prefix functions ci --no-fund && npm --prefix functions run check && npm --prefix functions run audit:guard && npm --prefix functions run build
      - name: Sequential quota-aware production batches
        env:
          NAMES: ${{ inputs.function_names }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/targets.txt"
          const names = process.env.NAMES.split(',').map(s => s.trim());
          if (names.length < 1 || names.length > 100 || names.some(n => !/^[A-Za-z][A-Za-z0-9_-]{0,100}$/.test(n)) || new Set(names).size !== names.length) {
            throw Error('Invalid or duplicate function manifest');
          }
          for (const name of names) console.log(name);
          NODE
          mapfile -t targets < "$RUNNER_TEMP/targets.txt"
          size="$BATCH_SIZE"
          for ((i=0; i<${#targets[@]}; i+=size)); do
            batch=("${targets[@]:i:size}")
            scope=''
            for name in "${batch[@]}"; do
              [[ -z "$scope" ]] || scope+=,
              scope+="functions:$name"
            done
            echo "::group::Deploy batch $((i/size+1)): $scope"
            attempt=0
            while true; do
              attempt=$((attempt+1))
              if firebase deploy --only "$scope" --project nightjar-audio --non-interactive > "$RUNNER_TEMP/batch.log" 2>&1; then
                cat "$RUNNER_TEMP/batch.log"
                echo "Batch $((i/size+1)) succeeded" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              cat "$RUNNER_TEMP/batch.log"
              if grep -Eiq 'HTTP Error: 429|Quota exceeded|RESOURCE_EXHAUSTED' "$RUNNER_TEMP/batch.log" && ((attempt < 5)); then
                delay=$((60 * (2 ** (attempt-1)) + RANDOM % 30))
                echo "::warning::Quota throttled; retrying batch after ${delay}s"
                sleep "$delay"
              else
                echo "::error::Batch $((i/size+1)) failed; stopping. Earlier successful batches are retained."
                exit 1
              fi
            done
            echo "::endgroup::"
            if (( i+size < ${#targets[@]} )); then sleep 90; fi
          done
      - name: Verify deployed backend metadata
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nightjar-audio
      - run: node scripts/firebase-backend-verify.mjs
