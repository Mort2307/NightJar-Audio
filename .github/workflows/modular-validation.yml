name: Nightjar modular validation

on:
  pull_request:
    branches: [main, feature/self-service-professional-roles-20261010]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee modular-build.log

      - name: Install Functions dependencies
        id: functions_install
        continue-on-error: true
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Typecheck Functions
        id: functions_check
        continue-on-error: true
        working-directory: functions
        run: npm run check

      - name: Report validation failure on the PR
        if: steps.build.outcome == 'failure' || steps.functions_install.outcome == 'failure' || steps.functions_check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const frontend = fs.existsSync('modular-build.log')
              ? fs.readFileSync('modular-build.log', 'utf8')
              : 'No frontend build log was created.';
            const tail = frontend.split(/\r?\n/).slice(-120).join('\n');
            const body = [
              '## Nightjar modular validation failed',
              '',
              'Frontend build outcome: **${{ steps.build.outcome }}**',
              'Functions install outcome: **${{ steps.functions_install.outcome }}**',
              'Functions typecheck outcome: **${{ steps.functions_check.outcome }}**',
              '',
              '```text',
              tail.slice(-8000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail validation
        if: steps.build.outcome == 'failure' || steps.functions_install.outcome == 'failure' || steps.functions_check.outcome == 'failure'
        run: false
