name: Nightjar modular validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: nightjar-modular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee modular-typecheck.log
      - name: Build frontend
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee modular-build.log
      - name: Report validation failure on the PR
        if: github.event_name == 'pull_request' && (steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const readTail = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split(/\\r?\\n/).slice(-100).join('\\n') : 'No log was created.';
            const body = ['## Nightjar modular validation failed','','### Typecheck','~~~text',readTail('modular-typecheck.log').slice(-6000),'~~~','','### Build','~~~text',readTail('modular-build.log').slice(-6000),'~~~'].join('\\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: Fail validation
        if: steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
