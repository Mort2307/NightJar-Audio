# Manual, reviewed Firebase backend releases. Never auto-deploy Functions/rules on a web commit.
name: Deploy Nightjar Firebase backend (manual)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Select ONLY the backend resource intended for this release
        required: true
        type: choice
        options:
          - functions
          - firestore:rules
          - firestore:indexes
          - storage
          - all-backend

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightjar-firebase-backend-production
  cancel-in-progress: false

jobs:
  backend_deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-backend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check identity federation configuration
        env:
          PROVIDER: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [[ -z "$PROVIDER" || -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Configure production-backend variables NIGHTJAR_GCP_WIF_PROVIDER and NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT first. See docs/FIREBASE_DEPLOYMENT_AUTOMATION.md."
            exit 1
          fi

      - name: Install and validate frontend/security contracts
        run: npm ci --no-fund && npm run validate

      - name: Install, check and build Functions
        run: |
          npm --prefix functions ci --no-fund
          npm --prefix functions run check
          npm --prefix functions run audit:guard
          npm --prefix functions run build

      - name: Authenticate using short-lived Google credentials (no JSON key)
        uses: google-github-actions/auth@v3
        with:
          project_id: nightjar-audio
          workload_identity_provider: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy chosen backend scope
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          case "$REQUESTED_SCOPE" in
            functions|firestore:rules|firestore:indexes|storage)
              DEPLOY_SCOPE="$REQUESTED_SCOPE" ;;
            all-backend)
              DEPLOY_SCOPE="functions,firestore,storage" ;;
            *)
              echo "::error::Unexpected deployment scope"
              exit 1 ;;
          esac
          echo "Deploying Nightjar backend scope: $DEPLOY_SCOPE"
          npm exec --yes --package=firebase-tools@15.30.2 -- firebase deploy \
            --only "$DEPLOY_SCOPE" \
            --project nightjar-audio \
            --non-interactive

      - name: Summarise backend release
        if: always()
        env:
          DEPLOYED_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          echo "### Nightjar Firebase backend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested scope: \`$DEPLOYED_SCOPE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: \`$([[ '${{ job.status }}' == success ]] && echo success || echo check-logs)\`" >> "$GITHUB_STEP_SUMMARY"
