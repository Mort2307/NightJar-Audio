# Nightjar production backend: explicit, scoped deployments only.
# OIDC is restricted to this workflow on main by the GCP WIF provider.
name: Deploy Nightjar Firebase backend (manual)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Check connection or select a backend resource to deploy
        required: true
        default: auth-check
        type: choice
        options:
          - auth-check
          - plan
          - audio-eq-cors
          - functions:selected
          - didit:reconcile
          - didit:testers
          - admin-attention
          - functions
          - firestore:rules
          - firestore:indexes
          - storage
          - all-backend
      function_names:
        description: Only for functions:selected, comma-separated exported function names
        required: false
        type: string
      compare_ref:
        description: For plan, optional 40-character baseline Git commit (defaults to previous commit)
        required: false
        type: string
      confirmation:
        description: Deploy DEPLOY-NIGHTJAR; EQ CORS ENABLE-NIGHTJAR-AUDIO-EQ; all-backend ALL-BACKEND-NIGHTJAR
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightjar-firebase-backend-production
  cancel-in-progress: false

jobs:
  backend_deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    # Pin backend release runner during ubuntu-latest migration to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-backend
    env:
      REQUESTED_SCOPE: ${{ inputs.scope }}
      SELECTED_FUNCTIONS: ${{ inputs.function_names }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      FIREBASE_CLI_EXPERIMENTS: ''
    steps:
      - name: Verify release intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_SCOPE" == "auth-check" || "$REQUESTED_SCOPE" == "plan" ]]; then
            echo "Read-only mode; no Firebase resources will be deployed."
          elif [[ "$REQUESTED_SCOPE" == "audio-eq-cors" ]]; then
            [[ "$RELEASE_CONFIRMATION" == "ENABLE-NIGHTJAR-AUDIO-EQ" ]] || {
              echo "::error::Audio EQ CORS requires ENABLE-NIGHTJAR-AUDIO-EQ confirmation."; exit 1;
            }
          elif [[ "$REQUESTED_SCOPE" == "all-backend" ]]; then
            [[ "$RELEASE_CONFIRMATION" == "ALL-BACKEND-NIGHTJAR" ]] || {
              echo "::error::All-backend deploy requires ALL-BACKEND-NIGHTJAR confirmation."; exit 1;
            }
          else
            [[ "$RELEASE_CONFIRMATION" == "DEPLOY-NIGHTJAR" ]] || {
              echo "::error::Backend writes require DEPLOY-NIGHTJAR confirmation."; exit 1;
            }
          fi
          if [[ "$REQUESTED_SCOPE" == "functions:selected" ]]; then
            [[ -n "$SELECTED_FUNCTIONS" ]] || {
              echo "::error::Enter one or more function names."; exit 1;
            }
          fi

      - name: Checkout the production branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify WIF GitHub Actions variables
        env:
          PROVIDER: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || {
            echo "::error::Set NIGHTJAR_GCP_WIF_PROVIDER as a full projects/NUMBER/... provider path in GitHub Actions Variables."; exit 1;
          }
          [[ "$SERVICE_ACCOUNT" == "nightjar-backend-deploy@nightjar-audio.iam.gserviceaccount.com" ]] || {
            echo "::error::Set NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT to the dedicated Nightjar deployment account."; exit 1;
          }

      - name: Install Firebase CLI (pinned)
        run: npm install --global firebase-tools@15.33.0 --no-fund --no-audit

      - name: Authenticate to Google Cloud (short-lived, no stored key)
        uses: google-github-actions/auth@v3
        with:
          project_id: nightjar-audio
          workload_identity_provider: ${{ vars.NIGHTJAR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTJAR_GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Firebase CLI access to exact project
        shell: bash
        run: |
          set -euo pipefail
          firebase --version
          firebase projects:list --json |
            jq -e '(.result // []) | any(.[]; .projectId == "nightjar-audio")' >/dev/null
          echo "Firebase CLI authenticated to nightjar-audio via keyless OIDC."

      - name: Protect existing Firestore indexes from deletion
        if: ${{ inputs.scope == 'firestore:indexes' }}
        shell: bash
        run: |
          set -euo pipefail
          firebase firestore:indexes --project nightjar-audio --json > "$RUNNER_TEMP/nightjar-remote-indexes.json"
          # Add only requested indexes; preserve EVERY existing composite index,
          # single-field override and TTL retention policy. No destructive sync.
          cp firestore.indexes.json "$RUNNER_TEMP/nightjar-repository-indexes.json"
          node scripts/prepare-safe-firestore-indexes.mjs \
            "$RUNNER_TEMP/nightjar-remote-indexes.json" \
            "$RUNNER_TEMP/nightjar-repository-indexes.json" \
            "$RUNNER_TEMP/nightjar-union-indexes.json"
          node scripts/firestore-index-preservation-guard.mjs \
            "$RUNNER_TEMP/nightjar-remote-indexes.json" \
            "$RUNNER_TEMP/nightjar-union-indexes.json"
          cp "$RUNNER_TEMP/nightjar-union-indexes.json" firestore.indexes.json

      - name: Propose conservative release batches (read-only)
        if: ${{ inputs.scope == 'plan' }}
        env:
          BASE_INPUT: ${{ inputs.compare_ref }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci --ignore-scripts --no-fund --no-audit
          if [[ -n "$BASE_INPUT" ]]; then
            [[ "$BASE_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "::error::compare_ref must be a 40-character commit SHA."; exit 1;
            }
            BASE="$BASE_INPUT"
          else
            BASE="$(git rev-parse HEAD~1)"
            echo "::notice::Comparing only against the previous commit, not the last deployed backend revision."
          fi
          node scripts/firebase-backend-plan.mjs --base "$BASE" \
            --output "$RUNNER_TEMP/nightjar-backend-plan.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Validate frontend and contracts
        if: ${{ inputs.scope != 'auth-check' && inputs.scope != 'plan' && inputs.scope != 'audio-eq-cors' }}
        run: npm ci --no-fund && npm run validate

      - name: Install, check and build backend
        if: ${{ inputs.scope == 'functions' || inputs.scope == 'functions:selected' || inputs.scope == 'didit:reconcile' || inputs.scope == 'didit:testers' || inputs.scope == 'admin-attention' || inputs.scope == 'all-backend' }}
        run: |
          npm --prefix functions ci --no-fund
          npm --prefix functions run check
          npm --prefix functions run audit:guard
          npm --prefix functions run build

      - name: Deploy exact requested backend resources
        if: ${{ inputs.scope != 'auth-check' && inputs.scope != 'plan' && inputs.scope != 'audio-eq-cors' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_SCOPE" in
            functions)
              # Current named targets only. Never allow Firebase to delete legacy
              # deployed functions missing from the current source.
              DEPLOY_SCOPE="$(node scripts/firebase-current-functions-scope.mjs)"
              # Enumerate exact named targets once; never run one oversized,
              # quota-heavy deploy for the full (294+) function inventory.
              IFS=',' read -r -a targets <<< "$DEPLOY_SCOPE" ;;
            firestore:rules|firestore:indexes|storage)
              DEPLOY_SCOPE="$REQUESTED_SCOPE" ;;
            functions:selected)
              IFS=',' read -r -a names <<< "$SELECTED_FUNCTIONS"
              (( ${#names[@]} > 0 && ${#names[@]} <= 20 )) || {
                echo "::error::Select between 1 and 20 functions per batch."; exit 1;
              }
              targets=()
              for name in "${names[@]}"; do
                name="${name//[[:space:]]/}"
                [[ "$name" =~ ^[A-Za-z][A-Za-z0-9_-]{0,100}$ ]] || {
                  echo "::error::Invalid function name. Use exported names separated by commas."; exit 1;
                }
                targets+=("functions:$name")
              done
              DEPLOY_SCOPE="$(IFS=,; echo "${targets[*]}")" ;;
            didit:testers)
              # Staged tester rollout: account-owned one-time start, status, reconciliation and signed webhook.
              # Keep the legacy public starter paused and retain explicit member consent.
              targets=(functions:ageStatus functions:myDiditControlledCheck functions:startMyDiditControlledCheck functions:reconcileMyDiditVerification functions:diditWebhook functions:processDiditWebhook)
              DEPLOY_SCOPE="$(IFS=,; echo "${targets[*]}")" ;;
            didit:reconcile)
              # Safe recovery: reconciliation and status only. No new chargeable Didit sessions.
              targets=(functions:ageStatus functions:reconcileMyDiditVerification functions:adminReconcileDiditApproval functions:adminDiditDiagnostics functions:myDiditControlledCheck)
              DEPLOY_SCOPE="$(IFS=,; echo "${targets[*]}")" ;;
            admin-attention)
              # Deliberately fixed set of owner-only callables and event listeners.
              # Never deploy other backend functions from this release preset.
              DEPLOY_SCOPE="functions:getAdminAttentionPreferences,functions:saveAdminAttentionPreferences,functions:adminAttentionProfessionalApplications,functions:adminAttentionReleases,functions:adminAttentionScripts,functions:adminAttentionImages,functions:adminAttentionReviews,functions:adminAttentionEditorPortfolio,functions:adminAttentionReports,functions:adminAttentionSecurity,functions:adminAttentionSuggestions,functions:adminAttentionBilling,functions:listNotifications" ;;
            all-backend)
              DEPLOY_SCOPE="functions,firestore,storage" ;;
            *)
              echo "::error::Unexpected scope."; exit 1 ;;
          esac
          echo "Nightjar project=nightjar-audio; scope=$DEPLOY_SCOPE; commit=$GITHUB_SHA"
          date +%s > "$RUNNER_TEMP/nightjar-deploy-start"
          trap 'date +%s > "$RUNNER_TEMP/nightjar-deploy-end"' EXIT
          if [[ "$REQUESTED_SCOPE" == "functions" || "$REQUESTED_SCOPE" == "functions:selected" || "$REQUESTED_SCOPE" == "didit:reconcile" || "$REQUESTED_SCOPE" == "didit:testers" ]]; then
            # Reuse the existing OIDC-authorized workflow. Keep batches small
            # and never retry non-quota failures automatically.
            batch_size=5
            if [[ "$REQUESTED_SCOPE" == "functions" ]]; then batch_size=10; fi
            : > "$RUNNER_TEMP/nightjar-deploy.log"
            for ((i=0; i<${#targets[@]}; i+=batch_size)); do
              batch=("${targets[@]:i:batch_size}")
              batch_scope="$(IFS=,; echo "${batch[*]}")"
              attempt=0
              while true; do
                attempt=$((attempt+1))
                if firebase deploy --only "$batch_scope" --project nightjar-audio --non-interactive > "$RUNNER_TEMP/nightjar-batch.log" 2>&1; then
                  cat "$RUNNER_TEMP/nightjar-batch.log" | tee -a "$RUNNER_TEMP/nightjar-deploy.log"
                  break
                fi
                cat "$RUNNER_TEMP/nightjar-batch.log" | tee -a "$RUNNER_TEMP/nightjar-deploy.log"
                if grep -Eiq 'HTTP Error: 429|Quota exceeded|RESOURCE_EXHAUSTED' "$RUNNER_TEMP/nightjar-batch.log" && ((attempt < 5)); then
                  delay=$((60 * (2 ** (attempt-1)) + RANDOM % 30))
                  echo "::warning::Quota exceeded; retrying after ${delay}s"
                  sleep "$delay"
                else
                  echo "::error::Batch $((i/batch_size+1)) failed; stopping release."
                  exit 1
                fi
              done
              if ((i+batch_size < ${#targets[@]})); then
              if [[ "$REQUESTED_SCOPE" == "functions" ]]; then sleep 20; else sleep 90; fi
            fi
            done
          else
            firebase deploy --only "$DEPLOY_SCOPE" --project nightjar-audio --non-interactive 2>&1 \
              | tee "$RUNNER_TEMP/nightjar-deploy.log"
          fi

      # Workload Identity Federation is deliberately restricted to THIS
      # backend workflow's GitHub OIDC subject. The old standalone EQ workflow
      # was rejected by the GCP provider attribute condition.
      # Explicit scope and different confirmation protect this bucket update.
      - name: Set up Google Cloud CLI for EQ CORS
        if: ${{ inputs.scope == 'audio-eq-cors' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nightjar-audio

      - name: Prepare and apply approved Nightjar audio EQ CORS
        if: ${{ inputs.scope == 'audio-eq-cors' }}
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="gs://nightjar-audio.firebasestorage.app"
          [[ "$(gcloud config get-value project)" == "nightjar-audio" ]] || {
            echo "::error::Incorrect GCP project for CORS update."; exit 1;
          }
          # Read existing CORS before writing: never replace upload policies.
          gcloud storage buckets describe "$BUCKET" --format=json > "$RUNNER_TEMP/nightjar-audio-bucket.json"
          node scripts/prepare-nightjar-audio-cors.mjs "$RUNNER_TEMP/nightjar-audio-bucket.json" "$RUNNER_TEMP/nightjar-audio-cors.json"
          # GCS CLI previously returned GcsApiError('') on update, masking
          # whether bucket-level IAM or the API request itself was at fault.
          # Explicitly check storage.buckets.update, then PATCH *only* cors
          # with a metageneration precondition and verify with a fresh read.
          node scripts/apply-nightjar-audio-cors.mjs "$RUNNER_TEMP/nightjar-audio-bucket.json" "$RUNNER_TEMP/nightjar-audio-cors.json"
          echo "### Nightjar EQ audio CORS" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved Hosting origins can request signed audio through browser CORS." >> "$GITHUB_STEP_SUMMARY"
          echo "This does not grant public Storage access or change signed URL expiry." >> "$GITHUB_STEP_SUMMARY"

      # Firebase accepts index creation requests before composite indexes finish
      # building. Block the next (index-dependent) Cloud Functions batch until
      # the exact three verified-credit query indexes report READY.
      - name: Prepare Cloud SDK for credit index readiness
        if: ${{ success() && inputs.scope == 'firestore:indexes' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nightjar-audio

      - name: Require READY verified-credit indexes
        if: ${{ success() && inputs.scope == 'firestore:indexes' }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            gcloud firestore indexes composite list \
              --database='(default)' --project=nightjar-audio \
              --format=json > "$RUNNER_TEMP/nightjar-credit-index-states.json"
            if node scripts/verified-credit-index-readiness.mjs \
              "$RUNNER_TEMP/nightjar-credit-index-states.json" \
              "$RUNNER_TEMP/nightjar-repository-indexes.json"; then
              ready=1
              break
            fi
            sleep 20
          done
          if [[ "$ready" != '1' ]]; then
            echo "::error::New credit indexes are not READY. Block Cloud Functions and Hosting until Firestore completes building them."
            exit 1
          fi

      # Post-deploy verification is read-only. No webhooks, scheduled jobs,
      # auth callables, email sends, age checks, payments or write APIs are invoked.
      - name: Prepare Google Cloud CLI for function metadata checks
        if: ${{ success() && (inputs.scope == 'functions:selected' || inputs.scope == 'functions' || inputs.scope == 'admin-attention' || inputs.scope == 'all-backend') }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nightjar-audio

      - name: Verify live Cloud Functions and safe HTTP endpoints
        if: ${{ success() && (inputs.scope == 'functions:selected' || inputs.scope == 'functions' || inputs.scope == 'admin-attention' || inputs.scope == 'all-backend') }}
        run: node scripts/firebase-backend-verify.mjs

      - name: Write sanitized release report
        if: always()
        env:
          NIGHTJAR_JOB_OUTCOME: ${{ job.status }}
        run: node scripts/firebase-backend-report.mjs

      - name: Upload sanitized deployment report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightjar-backend-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nightjar-backend-release.json
            ${{ runner.temp }}/nightjar-backend-plan.json
            ${{ runner.temp }}/nightjar-verify.json
          if-no-files-found: ignore
          retention-days: 30
